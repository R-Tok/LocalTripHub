services:
  db:
    image: postgres
    restart: always
    environment:
      TZ: Asia/Tokyo
      POSTGRES_PASSWORD: password
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d LocalTripHub_development -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "bundle install && bundle exec rails db:prepare && rm -f tmp/pids/server.pid && ./bin/dev"
    tty: true
    stdin_open: true
    volumes:
      - .:/LocalTripHub
      - bundle_data:/usr/local/bundle:cached
      - node_modules:/LocalTripHub/node_modules
    environment:
      TZ: Asia/Tokyo
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    cpus: "2.0"
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '2.0'
        reservations:
          memory: 1g
  selenium:
    image: selenium/standalone-chrome:131.0.6778.85-chromedriver-131.0.6778.85
    container_name: selenium
    ports:
      - "4444:4444" # Selenium WebDriver用ポート
    shm_size: 2gb  # Chromeでのメモリ不足エラー防止
volumes:
  bundle_data:
  postgresql_data:
  node_modules: